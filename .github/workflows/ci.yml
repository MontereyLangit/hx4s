name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/minimal/package-lock.json

      - name: Install workspace dependencies
        run: npm ci
      - name: Type-check hx4s-vite
        run: npm run typecheck
      - name: sbt test
        run: sbt --batch test
      - name: sbt scripted
        run: sbt --batch sbtHx4s/scripted
      - name: Check -no-indent
        run: sbt --batch 'set ThisBuild / scalacOptions += "-no-indent"' Test/compile
      - name: Node tests (bridge, hydration, independence)
        run: npm test

      - name: Publish locally
        run: |
          node scripts/publish-local.mjs --reuse-node-modules
          node scripts/publish-local.mjs --verify --commit "$(git rev-parse HEAD)"
      - name: examples/minimal install
        run: |
          node scripts/setup-example.mjs minimal
          cd examples/minimal && npx playwright install --with-deps chromium
      - name: examples/minimal build
        working-directory: examples/minimal
        run: npm run build
      - name: examples/minimal type-check
        working-directory: examples/minimal
        run: npm run typecheck
      - name: examples/minimal test
        working-directory: examples/minimal
        run: npm test
      - name: Generated files are up to date
        # 新しく生成されてコミットされていないファイルも見る
        run: |
          git status --porcelain --untracked-files=all -- examples/minimal/app
          test -z "$(git status --porcelain --untracked-files=all -- examples/minimal/app)"
